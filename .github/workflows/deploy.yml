name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: dotnet publish src/HealthWatch -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, healthwatch-prod]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish
      - run: sudo /usr/local/bin/deploy-healthwatch "$GITHUB_WORKSPACE/publish"
